:root{
  --bg:#F5F4F0;--bg2:#FFFFFF;--bg3:#EDECE6;--bg4:#E1E0D8;
  --border:#E3E1DA;--border2:#CCCCC5;
  --text:#141A1D;--text2:#59636A;--text3:#8C969C;
  --brand:#123B4E;--brand2:#1C5872;--brand-bg:#E6EEF2;--brand-lt:#B2CAD7;
  --gold:#C2703D;--gold-bg:#FAECE2;--gold-dk:#8F4E24;
  --green:#177A46;--green-bg:#E4F3EA;
  --red:#B3261E;--red-bg:#FBE9E7;
  --amber:#8A5108;--amber-bg:#FDF0DC;
  --blue:#2A6CB8;--blue-bg:#E9F1FB;
  --purple:#7B3FA0;--purple-bg:#F2EAF9;
  --r:14px;--r2:11px;
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --sh:0 1px 2px rgba(12,26,33,.05),0 2px 8px rgba(12,26,33,.06);
  --sh2:0 8px 26px rgba(12,26,33,.14);
  --top:60px;--bot:70px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{width:0;height:0}

/* ============ TOPO ============ */
.top{position:fixed;top:0;left:0;right:0;background:var(--brand);color:#fff;z-index:60;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:11px;min-height:var(--top)}
.top .lg{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.top .lg svg{width:36px;height:36px;border-radius:10px}
.top .tt{flex:1;min-width:0}
.top .tt b{font-size:16px;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt span{font-size:11px;color:#9FB8C5;display:block}
.top .bt{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.13);border:0;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.top .bt:active{background:rgba(255,255,255,.26)}
.top .bt.badge{position:relative}
.top .bt.badge i.n{position:absolute;top:-3px;right:-3px;background:#E09659;color:#0A2531;font-size:10px;
  font-weight:900;border-radius:9px;padding:1px 5px;font-style:normal}

/* ============ ESTRUTURA ============ */
.main{padding-top:var(--top);padding-bottom:calc(var(--bot) + env(safe-area-inset-bottom));min-height:100%}
.wrap{padding:16px 14px 24px}
.pg{display:none}.pg.on{display:block;animation:fi .18s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--bot);background:var(--bg2);border-top:1px solid var(--border);
  z-index:60;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--text3);font-size:10.5px;font-weight:700;position:relative}
.bnav button i.ti{font-size:23px}
.bnav button.on{color:var(--brand)}
.bnav button .bd{position:absolute;top:8px;left:50%;margin-left:6px;background:var(--red);color:#fff;
  font-size:9.5px;font-weight:900;border-radius:9px;padding:0 5px}

/* ============ COMPONENTES ============ */
.hero{background:linear-gradient(150deg,var(--brand),#0A2531);color:#fff;border-radius:var(--r);
  padding:16px 17px;margin-bottom:15px;box-shadow:var(--sh)}
.hero h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
.hero p{font-size:12.5px;color:#9FB8C5;margin-top:2px}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.hero .row div{background:rgba(255,255,255,.11);border-radius:11px;padding:9px 8px;text-align:center}
.hero .row span{font-size:9.5px;color:#9FB8C5;font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block}
.hero .row b{font-size:18px;font-weight:800;display:block;margin-top:2px}

h2.sec{font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--text2);
  margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .sp{flex:1}
h2.sec a{font-size:12px;color:var(--brand);font-weight:700;text-transform:none;letter-spacing:0}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:13px;overflow:hidden}
.card .hd{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
.card .hd i.ti{font-size:18px;color:var(--text2)} .card .hd .sp{flex:1}
.card .bd{padding:14px}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.tile{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px 13px;
  display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh);text-align:left;min-height:104px}
.tile:active{transform:scale(.98)}
.tile .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px}
.tile b{font-size:14px;line-height:1.25;display:block}
.tile span{font-size:11.5px;color:var(--text3);display:block;margin-top:1px}

.lin{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:13px}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bg3);width:100%;
  background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li:active{background:var(--bg3)}
.li .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.li .inf{flex:1;min-width:0}
.li .inf b{font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .inf span{font-size:12px;color:var(--text3);display:block}
.li .vl{text-align:right;flex:none}
.li .vl b{font-size:15px;font-weight:800;display:block;white-space:nowrap}
.li .vl span{font-size:11px;color:var(--text3)}
.li .ch{color:var(--border2);font-size:20px;flex:none}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;white-space:nowrap}
.p-ras{background:var(--bg4);color:var(--text2)} .p-pro{background:var(--amber-bg);color:var(--amber)}
.p-env{background:var(--blue-bg);color:var(--blue)} .p-ok{background:var(--green-bg);color:var(--green)}
.p-rej{background:var(--red-bg);color:var(--red)}

.al{display:flex;gap:10px;padding:12px 13px;border-radius:var(--r2);font-size:13px;margin-bottom:12px;align-items:flex-start;line-height:1.5}
.al i.ti{font-size:19px;flex:none;margin-top:1px}
.a-i{background:var(--brand-bg);color:#0A2531;border:1px solid var(--brand-lt)}
.a-g{background:var(--green-bg);color:#0F5130;border:1px solid #B6DFC4}
.a-e{background:var(--red-bg);color:#7C1D14;border:1px solid #F0C4C0}
.a-w{background:var(--amber-bg);color:#6B3E05;border:1px solid #F5DCB0}

.btn{border:0;border-radius:var(--r2);padding:14px 18px;font-size:15px;font-weight:700;background:var(--brand);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{filter:brightness(.92)}
.btn i.ti{font-size:20px}
.btn.gh{background:var(--bg2);color:var(--text2);border:1px solid var(--border2)}
.btn.gn{background:var(--green)} .btn.rd{background:var(--red)} .btn.gd{background:var(--gold);color:#0A2531}
.btn.bl{background:var(--blue)} .btn.pu{background:var(--purple)}
.btn.sm{padding:10px 14px;font-size:13.5px;width:auto}
.btn.xs{padding:7px 11px;font-size:12.5px;width:auto;border-radius:9px}
.brow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.brow .btn{flex:1;min-width:130px}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:6px}
.fg label .rq{color:var(--red)}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--border2);border-radius:var(--r2);
  padding:13px 13px;background:var(--bg2);font-size:16px;outline:none}
.fg select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%238B9C94' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:36px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.fg textarea{min-height:96px;resize:vertical;line-height:1.5}
.fg .hint{font-size:11.5px;color:var(--text3);margin-top:5px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:22px;background:var(--bg3);color:var(--text2);font-size:13px;font-weight:700;border:1px solid transparent}
.chip.on{background:var(--brand);color:#fff}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:4px;gap:3px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;background:transparent;border:0;padding:10px 8px;border-radius:9px;font-size:13px;font-weight:700;
  color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--bg2);color:var(--brand);box-shadow:var(--sh)}

.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fslot{position:relative;aspect-ratio:1;border:2px dashed var(--border2);border-radius:13px;background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.fslot i.ti{font-size:25px;color:var(--text3)}
.fslot span{font-size:10px;color:var(--text3);font-weight:700;margin-top:2px}
.fslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fslot .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:8px;background:rgba(179,38,30,.94);
  color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:15px}

.itens{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:12px}
.itens .it{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--bg3);font-size:13.5px}
.itens .it:last-child{border-bottom:0}
.itens .it .n{flex:1;min-width:0}
.itens .it .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itens .it .n span{font-size:11.5px;color:var(--text3)}
.itens .it .x{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);
  color:var(--red);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.vazio{padding:30px 16px;text-align:center;color:var(--text3)}
.vazio i.ti{font-size:42px;display:block;margin-bottom:9px;opacity:.45}
.vazio b{display:block;color:var(--text2);font-size:15px;margin-bottom:4px}

/* ============ FOLHA (modal de baixo) ============ */
.sheet{position:fixed;inset:0;z-index:200;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(12,24,19,.55);backdrop-filter:blur(2px)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-radius:22px 22px 0 0;
  max-height:92%;display:flex;flex-direction:column;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .ph{padding:8px 0 4px;display:flex;justify-content:center;flex:none}
.sheet .ph i{width:42px;height:4px;border-radius:3px;background:var(--border2);display:block}
.sheet .hh{padding:6px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex:none}
.sheet .hh b{font-size:17px;font-weight:800;flex:1}
.sheet .hh .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text2)}
.sheet .bb{padding:16px;overflow-y:auto;flex:1}
.sheet .ff{padding:12px 16px 16px;border-top:1px solid var(--border);flex:none;display:flex;gap:9px}
.sheet .ff .btn{flex:1}

/* ============ TELA CHEIA (formulário) ============ */
.full{position:fixed;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column}
.full.on{display:flex}
.full .fh{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display:flex;align-items:center;gap:10px;flex:none}
.full .fh .bk{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.13);border:0;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.full .fh b{flex:1;font-size:16.5px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.full .fh span{font-size:11.5px;color:#9FB8C5;display:block;font-weight:600}
.full .fb{flex:1;overflow-y:auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.full .fx{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--border);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px}
.full .fx .btn{flex:1}

/* ============ AVISO ============ */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 16px);z-index:300;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%}
#toast div{padding:13px 18px;border-radius:13px;font-size:14px;font-weight:600;color:#fff;
  box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;gap:9px;align-items:center;width:100%}
.qrbox{background:#fff;padding:16px;border-radius:14px;display:flex;justify-content:center}
.qrbox canvas,.qrbox svg{width:100%;max-width:280px;height:auto;image-rendering:pixelated}
.codebox{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;max-height:130px;overflow-y:auto;color:var(--text2)}
.mut{color:var(--text3);font-size:12.5px}
.hide{display:none!important}
.pb{height:8px;background:var(--bg4);border-radius:5px;overflow:hidden}
.pf{height:100%;border-radius:5px;background:var(--brand)}
</style>
</head>

          pattern = i;

      for (var r = 8; r < _moduleCount - 8; r += 1) {

          continue;
        }

        if (_modules[6][c] != null) {
          continue;
        }

        } else {

        }

                bitIndex = 7;

          + '>'
          + totalDataCount * 8
          + ')';

      // end code

        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

        break;

        break;

          for (var i = 0; i < rsBlocks.length; i++) {

          }

      return createDataURL(size, size, function(x, y) {

      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';

      img += '/>';

        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;

      var max = size - margin;

        ' █': '▄',
        '  ': ' '

        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {

        r2 = Math.floor((y + 1 - min) / cellSize);

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {

          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

      return ascii.substring(0, ascii.length-1);

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {

          }

        for (r = 0; r < cellSize; r += 1) {

        }

        if (b == -1) throw 'eof';
        return b;

        var b0 = bin.read();
        if (b0 == -1) break;

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

function initDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id',autoIncrement:true}); });

/* ---------------- pacote de transferência (offline) ----------------
   Formato:  JEV1.<tipo>.<base64url(gzip(JSON))>
   tipo: cat  = catálogo do desktop para o celular
         gui  = guias do celular para o desktop
------------------------------------------------------------------- */
function b64urlEnc(bytes){
  let s='';const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDec(str){
  const s=str.replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(s+'==='.slice((s.length+3)%4));
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function gzip(u8){
  if(typeof CompressionStream==='undefined') return {z:false,d:u8};
  const cs=new CompressionStream('gzip');
  const buf=await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer();
  return {z:true,d:new Uint8Array(buf)};
}
async function gunzip(u8){
  if(typeof DecompressionStream==='undefined') return u8;
  const ds=new DecompressionStream('gzip');
  const buf=await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
async function pacoteCriar(tipo,obj){
  const json=new TextEncoder().encode(JSON.stringify(obj));
  const {z,d}=await gzip(json);
  return `JEV1.${tipo}${z?'z':''}.${b64urlEnc(d)}`;
}
async function pacoteLer(txt){
  const s=String(txt||'').trim().replace(/\s+/g,'');
  const m=s.match(/^JEV1\.([a-z]+?)(z?)\.([A-Za-z0-9\-_]+)$/);
  if(!m) throw new Error('Este conteúdo não é um pacote da JeV.');
  let bytes=b64urlDec(m[3]);
  if(m[2]==='z') bytes=await gunzip(bytes);
  return {tipo:m[1], obj:JSON.parse(new TextDecoder().decode(bytes))};
}

function comprimir(file,maxW,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,(maxW||1100)/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q||0.62));
      };
      img.onerror=rej;img.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

function baixar(conteudo,nome,mime){
  const blob=new Blob([conteudo],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=nome;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* resumo curto de uma guia, usado nas listas */
function resumoGuia(g){
  const d=g.dados||{};
  switch(g.tipo){
    case 'rdo': return `${nomeRef('obras',d.obraId)} · ${dbr(d.data)}`;
    case 'apont': return `${nomeRef('obras',d.obraId)} · ${(d.equipe||[]).length} profissional(is)`;
    case 'medicao': return `${d.etapa||''} · ${qtd(d.avanco,0)}%`;
    case 'requisicao': return `${nomeRef('obras',d.obraId)} · ${(d.itens||[]).length} item(ns)`;
    case 'despesa': return `${d.desc||''} · ${moeda(d.valor)}`;
    case 'receita': return `${d.desc||''} · ${moeda(d.valor)}`;
    case 'producao': return `${d.acao||''} · ${nomeRef('ciclos',d.cicloId)}`;
    case 'ocorrencia': return `${d.titulo||''}`;
  }
  return '';
}
function nomeRef(fonte,id){
  const lista=(CAT[fonte]||[]);
  const x=lista.find(y=>String(y.id)===String(id));
  if(!x) return '—';
  return x.nome || x.modelo || x.cod || '—';
}
function valorGuia(g){
  const d=g.dados||{};
  if(g.tipo==='despesa'||g.tipo==='receita') return num(d.valor);
  if(g.tipo==='producao') return num(d.valor);
  if(g.tipo==='apont') return (d.equipe||[]).reduce((s,p)=>s+num(p.qtd)*num(p.valor),0);
  return 0;
}
/* =========================================================================
   FORMULÁRIO GENÉRICO — monta a tela a partir do esquema de cada tipo
   ========================================================================= */
let FORM = null;   // {tipo, id, dados}

function novaGuia(tipoId){
  const t = tipoInfo(tipoId);
  const dados = {};
  t.campos.forEach(c=>{
    if(c.t==='lista') dados[c.k]=[];
    else if(c.t==='fotos') dados[c.k]=[];
    else if(c.t==='etapasMulti') dados[c.k]=[];
    else if(c.def!==undefined) dados[c.k]= typeof c.def==='function'?c.def():c.def;
    else if(c.t==='chk') dados[c.k]=false;
    else if(c.t==='sel') dados[c.k]=(c.opts||[])[0]||'';
    else if(c.t==='unidade') dados[c.k]='obras';
    else dados[c.k]='';
  });
  FORM={tipo:tipoId,id:null,dados};
  abrirForm();
}
async function editarGuia(id){
  const g = await dbGet('guias',id);
  if(!g) return;
  if(g.status==='Encaminhada'){ verGuia(id); return; }
  FORM={tipo:g.tipo,id:g.id,dados:JSON.parse(JSON.stringify(g.dados||{}))};
  abrirForm();
}
function abrirForm(){
  const t=tipoInfo(FORM.tipo);
  document.getElementById('full-t').textContent=t.nome;
  document.getElementById('full-s').textContent=FORM.id?'Editando guia salva':'Nova guia';
  document.getElementById('full-del').classList.toggle('hide',!FORM.id);
  document.getElementById('full-x').innerHTML=
    `<button class="btn gh" onclick="salvarGuia('Rascunho')"><i class="ti ti-device-floppy"></i>Salvar</button>
     <button class="btn gn" onclick="salvarGuia('Pronta')"><i class="ti ti-checkbox"></i>Concluir</button>`;
  formRender();
  document.getElementById('full').classList.add('on');
  document.body.style.overflow='hidden';
}
function fecharForm(){
  document.getElementById('full').classList.remove('on');
  document.body.style.overflow='';
  FORM=null;
  if(PG==='saida') telaSaida(); else if(PG==='inicio') telaInicio();
}

function formRender(){
  const t=tipoInfo(FORM.tipo), d=FORM.dados;
  let h=`<div class="al a-i" style="margin-bottom:16px"><i class="ti ${t.ic}"></i>
    <div><b>${esc(t.nome)}</b><br>${esc(t.desc)}</div></div>`;
  let meiaAberta=false;
  t.campos.forEach(c=>{
    const campo=campoHTML(c,d[c.k]);
    if(c.meia && !meiaAberta){ h+=`<div class="fr2">${campo}`; meiaAberta=true; }
    else if(c.meia && meiaAberta){ h+=`${campo}</div>`; meiaAberta=false; }
    else { if(meiaAberta){ h+='</div>'; meiaAberta=false; } h+=campo; }
  });
  if(meiaAberta) h+='</div>';
  h+=`<div id="f-err"></div><div style="height:12px"></div>`;
  document.getElementById('full-b').innerHTML=h;
}

function campoHTML(c,v){
  const id='f-'+c.k;
  const lab=`<label>${esc(c.l)}${c.req?' <span class="rq">*</span>':''}</label>`;
  const hint=c.hint?`<div class="hint">${esc(c.hint)}</div>`:'';
  const ph=c.ph?` placeholder="${esc(c.ph)}"`:'';
  const set=`onchange="setCampo('${c.k}',this.value)"`;
  switch(c.t){
    case 'texto': return `<div class="fg">${lab}<input id="${id}" value="${esc(v)}"${ph} ${set} oninput="FORM.dados['${c.k}']=this.value">${hint}</div>`;
    case 'area':  return `<div class="fg">${lab}<textarea id="${id}"${ph} oninput="FORM.dados['${c.k}']=this.value">${esc(v)}</textarea>${hint}</div>`;
    case 'num':   return `<div class="fg">${lab}<input id="${id}" type="number" inputmode="decimal" step="0.01" value="${v===''?'':num(v)}" oninput="FORM.dados['${c.k}']=this.value">${hint}</div>`;
    case 'moeda': return `<div class="fg">${lab}<input id="${id}" type="number" inputmode="decimal" step="0.01" value="${v===''?'':num(v)}"${ph} oninput="FORM.dados['${c.k}']=this.value">${hint}</div>`;
    case 'percent': return `<div class="fg">${lab}
        <div style="display:flex;align-items:center;gap:12px">
          <input id="${id}" type="range" min="0" max="100" step="5" value="${num(v)}" style="flex:1"
            oninput="FORM.dados['${c.k}']=this.value;document.getElementById('pv-${c.k}').textContent=this.value+'%'">
          <b id="pv-${c.k}" style="font-size:22px;min-width:62px;text-align:right;color:var(--brand)">${num(v)}%</b></div>
        <div class="chips" style="margin-top:10px">${[0,25,50,75,90,100].map(x=>
          `<button type="button" class="chip" onclick="setPercent('${c.k}',${x})">${x}%</button>`).join('')}</div>${hint}</div>`;
    case 'data':  return `<div class="fg">${lab}<input id="${id}" type="date" value="${esc(v)}" onchange="FORM.dados['${c.k}']=this.value">${hint}</div>`;
    case 'sel':   return `<div class="fg">${lab}<select id="${id}" ${set}>
        ${(c.opts||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${hint}</div>`;
    case 'chk':   return `<div class="fg"><label style="display:flex;align-items:center;gap:11px;font-size:14.5px;color:var(--text)">
        <input type="checkbox" id="${id}" ${v?'checked':''} onchange="FORM.dados['${c.k}']=this.checked"
          style="width:22px;height:22px;flex:none">${esc(c.l)}</label>${hint}</div>`;
    case 'unidade': {
      const uns=['obras','imoveis','veiculos','chacara','produtos','info','midia','geral'];
      return `<div class="fg">${lab}<select id="${id}" onchange="setCampo('${c.k}',this.value,true)">
        ${uns.map(u=>`<option value="${u}" ${v===u?'selected':''}>${UN_NOMES[u]}</option>`).join('')}</select>${hint}</div>`;
    }
    case 'ref': {
      const lista=CAT[c.fonte]||[];
      if(!lista.length) return `<div class="fg">${lab}<div class="al a-w" style="margin:0"><i class="ti ti-alert-triangle"></i>
        <div>Nenhum item no catálogo. Importe o catálogo em <b>Ajustes</b> ou escreva o nome no campo abaixo.</div></div>
        <input id="${id}" value="${esc(v)}" placeholder="Escreva o nome" style="margin-top:9px"
          oninput="FORM.dados['${c.k}']=this.value"></div>`;
      return `<div class="fg">${lab}<select id="${id}" onchange="setCampo('${c.k}',this.value,true)">
        <option value="">— escolha —</option>
        ${lista.map(x=>`<option value="${esc(x.id)}" ${String(v)===String(x.id)?'selected':''}>${esc(rotuloRef(c.fonte,x))}</option>`).join('')}
        </select>${hint}</div>`;
    }
    case 'refUn': {
      const un=FORM.dados.un||'obras';
      const fonte={obras:'obras',imoveis:'imoveis',veiculos:'veiculos',chacara:'ciclos',
                   produtos:'produtos',info:'produtos',midia:'canais',geral:null}[un];
      const lista=fonte?(CAT[fonte]||[]):[];
      if(!lista.length) return '';
      return `<div class="fg">${lab}<select id="${id}" onchange="FORM.dados['${c.k}']=this.value">
        <option value="">— nada específico —</option>
        ${lista.map(x=>`<option value="${esc(x.id)}" ${String(v)===String(x.id)?'selected':''}>${esc(rotuloRef(fonte,x))}</option>`).join('')}
        </select>${hint}</div>`;
    }
    case 'etapa': {
      const et=etapasDaObra();
      if(!et.length) return `<div class="fg">${lab}<input id="${id}" value="${esc(v)}" placeholder="Escreva a etapa"
        oninput="FORM.dados['${c.k}']=this.value">${hint}</div>`;
      return `<div class="fg">${lab}<select id="${id}" onchange="FORM.dados['${c.k}']=this.value">
        <option value="">— escolha —</option>
        ${et.map(e=>`<option ${v===e.nome?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>${hint}</div>`;
    }
    case 'etapasMulti': {
      const et=etapasDaObra(); const sel=Array.isArray(v)?v:[];
      if(!et.length) return '';
      return `<div class="fg">${lab}<div class="chips">${et.map(e=>
        `<button type="button" class="chip ${sel.includes(e.nome)?'on':''}" onclick="toggleEtapa('${c.k}','${esc(e.nome).replace(/'/g,"\\'")}')">${esc(e.nome)}</button>`).join('')}</div>${hint}</div>`;
    }
    case 'pessoa': {
      const lista=(CAT[c.fonte]||[]).map(x=>x.nome).filter(Boolean);
      return `<div class="fg">${lab}<input id="${id}" list="dl-${c.k}" value="${esc(v)}"${ph}
        oninput="FORM.dados['${c.k}']=this.value">
        <datalist id="dl-${c.k}">${lista.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>${hint}</div>`;
    }
    case 'catDesp': case 'catRec': {
      const lista=(c.t==='catDesp'?CAT.catsDesp:CAT.catsRec)||[];
      if(!lista.length) return `<div class="fg">${lab}<input id="${id}" value="${esc(v)}" oninput="FORM.dados['${c.k}']=this.value">${hint}</div>`;
      return `<div class="fg">${lab}<select id="${id}" ${set}>
        ${lista.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${hint}</div>`;
    }
    case 'fotos': {
      const fotos=Array.isArray(v)?v:[];
      let g=`<div class="fg">${lab}<div class="fotos">`;
      for(let i=0;i<(c.max||6);i++){
        g+= fotos[i]
          ? `<div class="fslot"><img src="${fotos[i]}"><button type="button" class="x" onclick="tirarFoto('${c.k}',${i})"><i class="ti ti-trash"></i></button></div>`
          : (i===fotos.length
              ? `<button type="button" class="fslot" onclick="addFoto('${c.k}',${c.max||6})"><i class="ti ti-camera-plus"></i><span>Foto ${i+1}</span></button>`
              : `<div class="fslot" style="opacity:.4"><i class="ti ti-photo"></i></div>`);
      }
      g+=`</div><div class="hint">As fotos são reduzidas antes de salvar, para o pacote não ficar pesado.</div></div>`;
      return g;
    }
    case 'lista': {
      const itens=Array.isArray(v)?v:[];
      return `<div class="fg">${lab}
        <div class="itens">${itens.length?itens.map((x,i)=>`
          <div class="it"><div class="n"><b>${esc(x.nome||x.desc||'—')}</b>
            <span>${esc(subResumo(c,x))}</span></div>
            <button type="button" class="x" onclick="delItem('${c.k}',${i})"><i class="ti ti-trash"></i></button></div>`).join('')
          : `<div class="vazio" style="padding:18px"><b>Nenhum ${esc(c.item||'item')}</b>Toque em adicionar</div>`}</div>
        <button type="button" class="btn gh" onclick="addItem('${c.k}')"><i class="ti ti-plus"></i>Adicionar ${esc(c.item||'item')}</button>${hint}</div>`;
    }
  }
  return '';
}

function rotuloRef(fonte,x){
  if(fonte==='obras') return `${x.cod?x.cod+' — ':''}${x.nome}`;
  if(fonte==='veiculos') return `${x.placa||''} — ${x.modelo||''}`;
  if(fonte==='imoveis') return `${x.cod?x.cod+' — ':''}${x.nome}`;
  if(fonte==='ciclos') return `${x.nome}${x.cultura?' ('+x.cultura+')':''}`;
  if(fonte==='canais') return `${x.nome}${x.plataforma?' — '+x.plataforma:''}`;
  return x.nome||x.desc||String(x.id);
}
function etapasDaObra(){
  const o=(CAT.obras||[]).find(x=>String(x.id)===String(FORM.dados.obraId));
  return (o&&o.etapas)||[];
}
function subResumo(c,x){
  if(c.k==='equipe') return `${qtd(x.qtd,1)} ${x.und||'dia'} × ${moeda(x.valor)} = ${moeda(num(x.qtd)*num(x.valor))}`;
  if(c.k==='itens') return `${qtd(x.qtd,2)} ${x.und||''}`;
  return '';
}
function setCampo(k,v,rerender){

function setPercent(k,v){ FORM.dados[k]=v; formRender(); }
function toggleEtapa(k,nome){

let _fotoCampo=null,_fotoMax=6;
function addFoto(k,max){ _fotoCampo=k;_fotoMax=max; document.getElementById('fileFoto').click(); }
function tirarFoto(k,i){ FORM.dados[k].splice(i,1); formRender(); }
function ligarEntradaFoto(){

/* ---------------- itens de lista ---------------- */
function addItem(k){
  const t=tipoInfo(FORM.tipo), c=t.campos.find(x=>x.k===k);
  const sub=c.sub||[];
  let h='';
  sub.forEach(s=>{
    const id='si-'+s.k;
    if(s.t==='pessoa'){
      const lista=(CAT[s.fonte]||[]);
      h+=`<div class="fg"><label>${esc(s.l)}${s.req?' <span class="rq">*</span>':''}</label>
        <input id="${id}" list="dl-${s.k}" onchange="preencherEquipe(this.value)">
        <datalist id="dl-${s.k}">${lista.map(p=>`<option value="${esc(p.nome)}">`).join('')}</datalist></div>`;
    } else if(s.t==='insumo'){
      const lista=(CAT.insumos||[]);
      h+=`<div class="fg"><label>${esc(s.l)}${s.req?' <span class="rq">*</span>':''}</label>
        <input id="${id}" list="dl-ins" onchange="preencherInsumo(this.value)">
        <datalist id="dl-ins">${lista.map(p=>`<option value="${esc(p.desc)}">`).join('')}</datalist></div>`;
    } else if(s.t==='sel'){
      h+=`<div class="fg"><label>${esc(s.l)}</label><select id="${id}">
        ${(s.opts||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;
    } else if(s.t==='num'||s.t==='moeda'){
      h+=`<div class="fg"><label>${esc(s.l)}${s.req?' <span class="rq">*</span>':''}</label>
        <input id="${id}" type="number" inputmode="decimal" step="0.01" value="${s.def!==undefined?s.def:''}"></div>`;
    } else {
      h+=`<div class="fg"><label>${esc(s.l)}</label><input id="${id}" value="${s.def!==undefined?esc(s.def):''}"></div>`;
    }
  });
  h+='<div id="si-err"></div>';
  sheet('Adicionar '+(c.item||'item'), h,
    `<button class="btn gh" onclick="fecharSheet()">Cancelar</button>
     <button class="btn gn" onclick="salvarItem('${k}')"><i class="ti ti-plus"></i>Adicionar</button>`);
}
function preencherEquipe(nome){
  const p=(CAT.equipe||[]).find(x=>x.nome===nome);
  if(!p) return;
  setVal('si-funcao',p.funcao||''); setVal('si-valor',num(p.valor)||'');
  const u=document.getElementById('si-und'); if(u&&p.und) u.value=p.und;
}
function preencherInsumo(desc){
  const i=(CAT.insumos||[]).find(x=>x.desc===desc);
  if(i) setVal('si-und',i.und||'un');
}
function salvarItem(k){
  const t=tipoInfo(FORM.tipo), c=t.campos.find(x=>x.k===k);
  const item={};
  let falta=null;
  (c.sub||[]).forEach(s=>{
    const v=val('si-'+s.k);
    if(s.req && !v) falta=s.l;
    item[s.k]= (s.t==='num'||s.t==='moeda')?num(v):v;
  });
  if(falta){ document.getElementById('si-err').innerHTML=
    `<div class="al a-e"><i class="ti ti-alert-circle"></i>Informe: ${esc(falta)}</div>`; return; }
  FORM.dados[k]=[...(FORM.dados[k]||[]),item];
  fecharSheet(); formRender();
}
function delItem(k,i){ FORM.dados[k].splice(i,1); formRender(); }

/* ---------------- salvar ---------------- */
async function salvarGuia(status){
  const t=tipoInfo(FORM.tipo), d=FORM.dados;
  for(const c of t.campos){
    if(!c.req) continue;
    const v=d[c.k];
    const vazio = v===''||v==null||(Array.isArray(v)&&!v.length)||(c.t==='moeda'&&num(v)<=0);
    if(vazio){
      document.getElementById('f-err').innerHTML=
        `<div class="al a-e"><i class="ti ti-alert-circle"></i>Falta preencher: <b>${esc(c.l)}</b></div>`;
      document.getElementById('f-err').scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  const base={tipo:FORM.tipo, dados:JSON.parse(JSON.stringify(d)), status,
              autor:CFG.usuario||'', funcao:CFG.funcao||'', alterado:agora()};
  if(FORM.id){
    const g=await dbGet('guias',FORM.id);
    await dbPut('guias',{...g,...base});
  }else{
    await dbAdd('guias',{...base, ref:uid(), criado:agora()});
  }
  await carregarGuias();
  fecharForm();
  toast(status==='Pronta'?'Guia concluída — já pode encaminhar':'Rascunho salvo','ok');
  go('saida');
}
function excluirGuiaAtual(){
  if(!FORM||!FORM.id) return;
  confirmar('Excluir guia','Esta guia será apagada do celular. Não dá para desfazer.',async()=>{
    await dbDel('guias',FORM.id); await carregarGuias(); fecharForm(); toast('Guia excluída','aviso');
  });
}
async function carregarGuias(){
  GUIAS=(await dbAll('guias')).sort((a,b)=>String(b.criado).localeCompare(String(a.criado)));
  contadores();
}

function contaFotos(gs){
  let n=0;

  return n;
}

async function verGuia(id){
  const g=await dbGet('guias',id); if(!g) return;
  const t=tipoInfo(g.tipo), d=g.dados||{};
  let h=`<div class="al a-i"><i class="ti ${t.ic}"></i><div><b>${esc(t.nome)}</b><br>
    ${pillGuia(g)} · ${dhr(g.alterado||g.criado)}</div></div><div class="itens">`;
  t.campos.forEach(c=>{

    if(c.t==='lista'){ h+=`<div class="it"><div class="n"><b>${esc(c.l)}</b><span>${v.length} item(ns)</span></div></div>`; return; }

/* =========================================================================
   ENCAMINHAR — gera o pacote e oferece as formas de envio
   ========================================================================= */
let ENVIO=null;   // {codigo, ids, nome, semFotos}

async function abrirEnvio(semFotos){
  const pro=GUIAS.filter(g=>g.status==='Pronta');
  if(!pro.length){ toast('Nenhuma guia pronta para encaminhar','aviso'); return; }
  sheet('Preparando…','<div class="vazio"><i class="ti ti-loader-2"></i><b>Montando o pacote</b>Um instante</div>','<span></span>');
  try{
    const guias=pro.map(g=>{
      const d=JSON.parse(JSON.stringify(g.dados||{}));
      if(semFotos) Object.keys(d).forEach(k=>{
        if(Array.isArray(d[k]) && d[k].some(x=>typeof x==='string'&&x.startsWith('data:image'))) d[k]=[];
      });
      return {ref:g.ref, tipo:g.tipo, dados:d, autor:g.autor||CFG.usuario||'',
              funcao:g.funcao||CFG.funcao||'', criado:g.criado, alterado:g.alterado};
    });
    const pacote={v:1, app:'JeV-Mobile', ver:APP_VER, aparelho:CFG.aparelho||'',
                  usuario:CFG.usuario||'', em:agora(), guias};
    const codigo=await pacoteCriar('gui',pacote);
    const quem=(CFG.usuario||'campo').split(' ')[0].toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'') || 'campo';
    ENVIO={codigo, ids:pro.map(g=>g.id), semFotos:!!semFotos,
           nome:`jev-guias-${hoje()}-${quem}.jev`};
    telaEnvio();
  }catch(e){ fecharSheet(); toast('Não consegui montar o pacote: '+e.message,'erro'); }
}

function rotuloCat(k,x){
  if(k==='veiculos') return `${x.placa||''} — ${x.modelo||''}`;

  return x.nome||x.desc||'—';

function subCat(k,x){
  if(k==='obras') return `${x.cod?x.cod+' · ':''}${x.status||''}${x.etapas?' · '+x.etapas.length+' etapas':''}`;
  if(k==='imoveis') return `${x.tipo||''}${x.status?' · '+x.status:''}`;
  if(k==='veiculos') return `${x.tipo||''}${x.status?' · '+x.status:''}`;
  if(k==='ciclos') return `${x.cultura||''}${x.status?' · '+x.status:''}`;
  if(k==='produtos') return `${x.tipo||''}${x.preco?' · '+moeda(x.preco):''}`;

  if(k==='equipe') return `${x.funcao||''}${x.valor?' · '+moeda(x.valor)+'/'+(x.und||'dia'):''}`;
  if(k==='pessoas') return `${x.tipo||''}${x.fone?' · '+x.fone:''}`;
  if(k==='insumos') return `${x.und||''}${x.categoria?' · '+x.categoria:''}`;

}

let NUVEM = {url:'', chave:'', email:'', refresh:'', inst:'', auto:true, ultimaBaixa:'', ultima:'', fotos:[]};
let NV_SESSAO = {token:'', expira:0};
let NV_OCUPADO = false;

const nvLigada = ()=> !!(NUVEM.url && NUVEM.chave && NUVEM.email && NUVEM.refresh);

async function nvCarregar(){
  const c = await dbGet('nuvem',1);
  NUVEM = {url:'', chave:'', email:'', refresh:'', inst:'', auto:true,
           ultimaBaixa:'', ultima:'', fotos:[], ...(c||{})};
  if(!NUVEM.inst){ NUVEM.inst = 'c'+Math.random().toString(36).slice(2,7); await nvGravar(); }

async function nvGravar(){ await dbPut('nuvem', {...NUVEM, id:1}); }

/* ---------------- conversa com o Supabase ---------------- */
const nvURL = c => String(NUVEM.url).replace(/\/+$/,'') + c;
const nvErro = j => (j && (j.msg||j.message||j.error_description||j.error)) || '';

async function nvEntrar(senha){
  const r = await fetch(nvURL('/auth/v1/token?grant_type=password'),{
    method:'POST', headers:{'apikey':NUVEM.chave,'Content-Type':'application/json'},
    body: JSON.stringify({email:NUVEM.email, password:senha})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(nvErro(j)||'usuário ou senha não conferem');
  NV_SESSAO = {token:j.access_token, expira:Date.now()+(j.expires_in||3600)*1000-60000};
  NUVEM.refresh = j.refresh_token||'';
  await nvGravar();
}
async function nvRenovar(){
  if(!NUVEM.refresh) throw new Error('sessão expirada — entre de novo com a senha');
  const r = await fetch(nvURL('/auth/v1/token?grant_type=refresh_token'),{
    method:'POST', headers:{'apikey':NUVEM.chave,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token:NUVEM.refresh})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ NUVEM.refresh=''; await nvGravar(); throw new Error('sessão expirada — entre de novo com a senha'); }
  NV_SESSAO = {token:j.access_token, expira:Date.now()+(j.expires_in||3600)*1000-60000};
  if(j.refresh_token){ NUVEM.refresh=j.refresh_token; await nvGravar(); }
}
async function nvSessao(){
  if(NV_SESSAO.token && Date.now()<NV_SESSAO.expira) return NV_SESSAO.token;
  await nvRenovar(); return NV_SESSAO.token;
}
async function nvAPI(caminho, opts={}){
  const t = await nvSessao();
  const r = await fetch(nvURL(caminho), {...opts,
    headers: Object.assign({'apikey':NUVEM.chave,'Authorization':'Bearer '+t}, opts.headers||{})});
  if(!r.ok){
    let m=''; try{ m = nvErro(await r.json()); }catch(e){ m = r.statusText; }
    throw new Error(`${m||'erro'} (${r.status})`);
  }
  return r;
}

/* ---------------- fotos vão para a pasta separada ---------------- */
async function nvHash(t){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(d)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function nvBlob(u){
  const [cab,b64] = String(u).split(',');
  const mime = (cab.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:mime});
}
async function nvSubirFoto(dataUrl){
  const h = await nvHash(dataUrl);
  const caminho = `fotos/${h}.jpg`;
  if(!NUVEM.fotos.includes(h)){
    const t = await nvSessao();
    const r = await fetch(nvURL(`/storage/v1/object/${NV_BALDE}/${caminho}`),{
      method:'POST', headers:{'apikey':NUVEM.chave,'Authorization':'Bearer '+t,'x-upsert':'true'},
      body: nvBlob(dataUrl)});
    if(!r.ok && r.status!==409) throw new Error('não consegui enviar uma foto ('+r.status+')');
    NUVEM.fotos.push(h);
    if(NUVEM.fotos.length>600) NUVEM.fotos = NUVEM.fotos.slice(-400);
  }
  return 'jevarq:'+caminho;
}
async function nvTrocarFotos(v){
  if(typeof v==='string') return v.startsWith('data:image') ? await nvSubirFoto(v) : v;
  if(Array.isArray(v)){ const o=[]; for(const x of v) o.push(await nvTrocarFotos(x)); return o; }
  if(v && typeof v==='object'){ const o={}; for(const k of Object.keys(v)) o[k]=await nvTrocarFotos(v[k]); return o; }
  return v;
}

/* =========================================================================
   ENVIAR AS GUIAS PELA INTERNET
   ========================================================================= */
async function nvEnviarGuias(){
  const prontas = GUIAS.filter(g=>g.status==='Pronta');
  if(!prontas.length) return {enviadas:0};
  const lote = [];
  for(const g of prontas){
    const dados = await nvTrocarFotos({
      ref:g.ref, tipo:g.tipo, dados:g.dados, autor:g.autor||CFG.usuario||'',
      funcao:g.funcao||CFG.funcao||'', aparelho:CFG.aparelho||'',
      criado:g.criado, alterado:g.alterado, recebido:new Date().toISOString(),
      status:'Recebida', destinos:[]
    });
    lote.push({gid:`guias.${NUVEM.inst}.${g.ref}`, tabela:'guias', dados,
               excluido:false, aparelho:NUVEM.inst, autor:CFG.usuario||''});
  }
  await nvAPI(`/rest/v1/${NV_TABELA}?on_conflict=gid`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify(lote)});
  for(const g of prontas)
    await dbPut('guias',{...g, status:'Encaminhada', enviado:new Date().toISOString(), alterado:agora(), viaNuvem:true});
  await carregarGuias();
  return {enviadas:prontas.length};
}

/* =========================================================================
   BAIXAR O CATÁLOGO E AS CONFIRMAÇÕES DO ESCRITÓRIO
   ========================================================================= */
async function nvBaixarCatalogo(){
  const cursor = NUVEM.ultimaBaixa || '1970-01-01T00:00:00Z';
  const novo = {};
  NV_CAT.forEach(t=>novo[t]=[]);
  let maior = cursor;

  /* o catálogo vem inteiro: é pequeno e assim nunca fica pela metade */
  const r = await nvAPI(`/rest/v1/${NV_TABELA}?select=gid,tabela,dados,excluido,atualizado`+
                        `&tabela=in.(${NV_CAT.join(',')})&excluido=is.false&order=atualizado.asc&limit=4000`);
  for(const linha of await r.json()){
    if(!novo[linha.tabela] || linha.excluido) continue;
    const id = String(linha.gid).split('.')[2];
    novo[linha.tabela].push({...linha.dados, id: isNaN(Number(id)) ? id : Number(id)});
    if(linha.atualizado > maior) maior = linha.atualizado;
  }

  /* as etapas viram uma lista dentro de cada obra, do jeito que as telas esperam */
  const obras = novo.obras.map(o=>({
    id:o.id, cod:o.cod||'', nome:o.nome, status:o.status||'',
    etapas: novo.etapas.filter(e=>String(e.obraId)===String(o.id))
                       .sort((a,b)=>num(a.ordem)-num(b.ordem))
                       .map(e=>({nome:e.nome, avanco:num(e.avanco)}))
  })).filter(o=>o.status!=='Concluída' && o.status!=='Cancelada');

  const cat = {
    id:1, v:1, em:new Date().toISOString(), origem:'Nuvem da JeV',
    obras,
    imoveis: novo.imoveis, veiculos: novo.veiculos.map(v=>({...v, nome:v.nome||v.modelo||''})),
    ciclos: novo.ciclos.filter(c=>c.status!=='Encerrado'),
    produtos: novo.produtos, canais: novo.canais,
    equipe: novo.equipe.filter(e=>e.ativo!==false), pessoas: novo.pessoas, insumos: novo.insumos,
    catsDesp: CAT_DESP_PADRAO, catsRec: CAT_REC_PADRAO
  };
  await dbPut('catalogo', cat);
  CAT = cat;

  /* confirmações: o escritório marcou como lançada? então some a pendência daqui */
  let confirmadas = 0;
  const rg = await nvAPI(`/rest/v1/${NV_TABELA}?select=gid,dados,atualizado`+
                         `&tabela=eq.guias&gid=like.guias.${NUVEM.inst}.*&order=atualizado.asc&limit=500`);
  for(const linha of await rg.json()){
    if(!String(linha.gid).startsWith(`guias.${NUVEM.inst}.`)) continue;
    const st = (linha.dados||{}).status;
    if(st!=='Lançada' && st!=='Descartada') continue;
    const ref = String(linha.gid).split('.')[2];
    const g = GUIAS.find(x=>x.ref===ref);
    if(g && g.status!=='Recebida'){
      await dbPut('guias',{...g, status:'Recebida', alterado:agora()});
      confirmadas++;
    }
    if(linha.atualizado > maior) maior = linha.atualizado;
  }
  if(confirmadas) await carregarGuias();

  NUVEM.ultimaBaixa = maior;
  await nvGravar();
  return {obras:cat.obras.length, equipe:cat.equipe.length, confirmadas};
}

/* =========================================================================
   SINCRONIZAR
   ========================================================================= */
async function nvSincronizar(silencioso){
  if(!nvLigada()){ if(!silencioso) toast('Conecte a nuvem em Ajustes.','aviso'); return; }
  if(NV_OCUPADO) return;
  if(!navigator.onLine){ if(!silencioso) toast('Sem internet agora — vou tentar depois.','aviso'); return; }
  NV_OCUPADO = true;
  try{
    const e = await nvEnviarGuias();
    const b = await nvBaixarCatalogo();
    NUVEM.ultima = new Date().toISOString();
    await nvGravar();
    const p = [];
    if(e.enviadas)    p.push(`${e.enviadas} guia(s) enviada(s)`);
    if(b.confirmadas) p.push(`${b.confirmadas} confirmada(s) pelo escritório`);
    if(!silencioso && !p.length) p.push(`catálogo em dia — ${b.obras} obra(s)`);
    if(p.length) toast(p.join(' · '),'ok');
    if(PG) go(PG);
  }catch(err){
    console.error(err);
    if(!silencioso) toast('Nuvem: '+err.message,'erro');
  }finally{ NV_OCUPADO = false; }
}

/* =========================================================================
   TELA DE AJUSTES — cartão da nuvem
   ========================================================================= */
function nvCartaoAjustes(){
  if(nvLigada()){
    return `<div class="card"><div class="hd"><i class="ti ti-cloud-check"></i>Nuvem da JeV</div><div class="bd">
      <div class="al a-g"><i class="ti ti-circle-check"></i><div>
        Conectado como <b>${esc(NUVEM.email)}</b>.
        ${NUVEM.ultima?`Última vez: <b>${dhr(NUVEM.ultima)}</b>.`:''}<br>
        As guias sobem sozinhas quando você toca em enviar, e o catálogo desce atualizado.</div></div>
      <button class="btn" onclick="nvSincronizar(false)"><i class="ti ti-refresh"></i>Sincronizar agora</button>
      <div style="height:9px"></div>
      <label style="display:flex;gap:11px;align-items:center;font-size:14px;margin:4px 0 12px">
        <input type="checkbox" ${NUVEM.auto?'checked':''} onchange="nvTrocarAuto(this.checked)"
          style="width:20px;height:20px;flex:none">Sincronizar sozinho ao abrir o aplicativo</label>
      <button class="btn gh" onclick="nvDesconectar()"><i class="ti ti-plug-off"></i>Desconectar deste celular</button>
    </div></div>`;
  }
  return `<div class="card"><div class="hd"><i class="ti ti-cloud"></i>Nuvem da JeV <span class="pill p-ras">opcional</span></div><div class="bd">
    <div class="al a-i"><i class="ti ti-info-circle"></i><div>
      Se o escritório já ligou a nuvem, conecte aqui: o catálogo chega sozinho e as guias vão pela internet,
      sem precisar mandar arquivo. <b>Sem conectar o aplicativo funciona igual</b> — só continua usando
      WhatsApp, arquivo ou QR.</div></div>
    <button class="btn gh" onclick="nvFormConectar()"><i class="ti ti-plug"></i>Conectar à nuvem</button>
  </div></div>`;
}
function nvFormConectar(){
  sheet('Conectar à nuvem',
    `<div class="fg"><label>Endereço do projeto <span class="rq">*</span></label>
      <input id="nv-url" placeholder="https://xxxxxxxx.supabase.co" value="${esc(NUVEM.url)}"></div>
     <div class="fg"><label>Chave pública (anon) <span class="rq">*</span></label>
      <textarea id="nv-key" style="min-height:80px;font-size:12px" placeholder="eyJhbGciOi…">${esc(NUVEM.chave)}</textarea></div>
     <div class="fg"><label>Seu e-mail <span class="rq">*</span></label>
      <input id="nv-mail" type="email" inputmode="email" placeholder="voce@exemplo.com" value="${esc(NUVEM.email)}"></div>
     <div class="fg"><label>Sua senha <span class="rq">*</span></label>
      <input id="nv-pass" type="password" placeholder="a senha que o escritório criou"></div>
     <div class="hint">Peça esses dados no escritório: eles aparecem em <b>Nuvem da JeV</b>, no sistema do computador.</div>
     <div id="nv-err"></div>`,
    `<button class="btn gh" onclick="fecharSheet()">Cancelar</button>
     <button class="btn gn" onclick="nvConectar()"><i class="ti ti-cloud-check"></i>Conectar</button>`);
}
async function nvConectar(){
  const err = document.getElementById('nv-err');
  const falha = m=>{ err.innerHTML = `<div class="al a-e"><i class="ti ti-alert-circle"></i>${esc(m)}</div>`; };
  const url = val('nv-url').replace(/\/+$/,''), key = val('nv-key'),
        mail = val('nv-mail'), pass = val('nv-pass');
  if(!/^https:\/\/.+\..+/.test(url)) return falha('O endereço precisa começar com https://');
  if(key.length<40) return falha('A chave parece incompleta.');
  if(!mail||!pass)  return falha('Informe o e-mail e a senha.');
  err.innerHTML = `<div class="al a-i"><i class="ti ti-loader-2"></i>Conectando…</div>`;
  NUVEM.url=url; NUVEM.chave=key; NUVEM.email=mail;
  try{
    await nvEntrar(pass);
    const r = await nvBaixarCatalogo();
    NUVEM.ultima = new Date().toISOString();
    await nvGravar();
    fecharSheet();
    toast(`Nuvem conectada — ${r.obras} obra(s) no catálogo`,'ok');
    telaAjustes();
  }catch(e){
    NUVEM.url=''; NUVEM.chave=''; NUVEM.email=''; NUVEM.refresh=''; await nvGravar();
    falha(e.message);
  }
}
async function nvTrocarAuto(v){ NUVEM.auto=!!v; await nvGravar(); }
function nvDesconectar(){
  confirmar('Desconectar da nuvem',
    'O celular para de mandar e receber pela internet. As guias e o catálogo que já estão aqui continuam.',
    async()=>{
      NUVEM = {...NUVEM, url:'', chave:'', email:'', refresh:'', ultimaBaixa:''};
      NV_SESSAO = {token:'',expira:0};
      await nvGravar(); telaAjustes(); toast('Desconectado da nuvem','aviso');
    });
}
/* =========================================================================
   PARTIDA DO APLICATIVO
   ========================================================================= */
async function iniciar(){
  try{
    await initDB();
  }catch(e){
    document.getElementById('r-inicio').innerHTML=
      `<div class="al a-e"><i class="ti ti-alert-circle"></i><div><b>Não consegui abrir o banco local</b><br>
       ${esc(e.message||e)}<br>Se estiver em aba anônima, abra o app normalmente.</div></div>`;
    return;
  }

  CFG = (await dbGet('config',1)) || {id:1, usuario:'', funcao:'', aparelho:''};
  await nvCarregar();
  CAT = (await dbGet('catalogo',1)) || {};
  await carregarGuias();

  ligarEntradaFoto();
  ligarEntradaCatalogo();
  ligarAtalhos();

  go('inicio');
  registrarSW();
  await lerLinkDeEntrada();

  /* com a nuvem ligada, o catálogo e as confirmações chegam sozinhos */
  if(nvLigada() && NUVEM.auto && navigator.onLine) setTimeout(()=>nvSincronizar(true), 1500);
}

/* arquivo do catálogo escolhido em Ajustes */
function ligarEntradaCatalogo(){
  document.getElementById('fileCat').addEventListener('change', async function(){
    const f=this.files[0]; this.value='';
    if(!f) return;
    try{ await importarTexto(await f.text()); }
    catch(e){ toast('Não consegui ler o arquivo: '+e.message,'erro'); }
  });
}

/* botão físico de voltar fecha o formulário/folha antes de sair do app */
function ligarAtalhos(){
  history.replaceState({jev:1},'');
  window.addEventListener('popstate',()=>{
    const full=document.getElementById('full').classList.contains('on');
    const sh=document.getElementById('sheet').classList.contains('on');
    const cf=document.getElementById('conf').classList.contains('on');
    if(cf){ document.getElementById('conf').classList.remove('on'); history.pushState({jev:1},''); return; }
    if(sh){ fecharSheet(); history.pushState({jev:1},''); return; }
    if(full){ fecharForm(); history.pushState({jev:1},''); return; }
    if(PG!=='inicio'){ go('inicio'); history.pushState({jev:1},''); return; }
  });
  history.pushState({jev:1},'');
}

/* catálogo enviado por link (#JEV1.catz.…) e atalhos da tela inicial (?novo= / ?pg=) */
async function lerLinkDeEntrada(){
  const q=new URLSearchParams(location.search);
  const pg=q.get('pg'), novo=q.get('novo');
  if(pg||novo) history.replaceState({jev:1},'',location.pathname);
  if(pg && ['inicio','nova','saida','emp','ajustes'].includes(pg)) go(pg);
  if(novo && TIPOS.some(t=>t.id===novo)) novaGuia(novo);

  const h=decodeURIComponent(location.hash||'').replace(/^#/,'');
  if(h.startsWith('JEV1.')){
    history.replaceState({jev:1},'',location.pathname);
    await importarTexto(h);
  }
}

/* service worker — deixa o app abrir sem internet e se atualizar sozinho */
function registrarSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol==='file:') return;
  navigator.serviceWorker.register('sw.js').then(r=>{
    r.addEventListener('updatefound',()=>{
      const novo=r.installing;
      if(!novo) return;
      novo.addEventListener('statechange',()=>{
        if(novo.state==='installed' && navigator.serviceWorker.controller){
          toast('Nova versão disponível — feche e abra o app','info');
        }
      });
    });
  }).catch(()=>{});
}

iniciar();
</script>
