name: Publicar o JeV Mobile

# Publica no GitHub Pages:
#   /            → o aplicativo do celular (PWA)
#   /sistema     → o sistema completo, instalável pelo navegador no computador
#   /atualizacao → as versões do sistema, como endereço reserva de atualização
# Depois de a primeira execução terminar, o endereço aparece em
# Settings → Pages e fica no formato:
#   https://SEU-USUARIO.github.io/NOME-DO-REPOSITORIO/

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'web/**'
      - 'atualizacao/**'
      - '.github/workflows/publicar-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Enviar o PWA para o GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Montar a pasta que vai para o ar
        run: |
          test -f mobile/dist/index.html || { echo "Falta mobile/dist — rode mobile/build.sh e faça o commit"; exit 1; }
          mkdir -p site
          cp -r mobile/dist/. site/
          if [ -d atualizacao ]; then
            mkdir -p site/atualizacao
            cp -r atualizacao/. site/atualizacao/
            echo "atualização publicada: $(ls atualizacao | tr '\n' ' ')"
          fi
          if [ -d web/dist ]; then
            mkdir -p site/sistema
            cp -r web/dist/. site/sistema/
            echo "sistema para computador: $(wc -c < site/sistema/index.html) bytes"
          fi
          echo "celular: $(wc -c < site/index.html) bytes"

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar a pasta do aplicativo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
