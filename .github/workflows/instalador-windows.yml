name: Instalador do Windows

# Gera o instalador (.exe) e publica em Releases.
# Dispare de dois jeitos:
#   1) criando uma tag de versão:   git tag v1.0.1 && git push origin v1.0.1
#   2) pela aba Actions do GitHub, no botão "Run workflow"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Gerar e publicar o instalador
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Acertar o dono do repositório no package.json
        shell: bash
        working-directory: desktop
        run: |
          node -e "
            const fs=require('fs');
            const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.build.publish=[{provider:'github',owner,repo,releaseType:'release'}];
            p.repository={type:'git',url:'https://github.com/'+owner+'/'+repo+'.git'};
            fs.writeFileSync('package.json',JSON.stringify(p,null,2));
            console.log('publicando em',owner+'/'+repo);
          "

      - name: Instalar as dependências
        working-directory: desktop
        run: npm ci

      - name: Conferir se o sistema está dentro do aplicativo
        shell: bash
        working-directory: desktop
        run: |
          test -f app/index.html || { echo "Falta desktop/app/index.html"; exit 1; }
          echo "app/index.html: $(wc -c < app/index.html) bytes"

      # Um instalador sem alguma destas peças abre normalmente e só falha
      # quando o dono clica no botão — que é a pior hora de descobrir.
      # Melhor quebrar aqui, na montagem, do que na casa dele.
      - name: Conferir se as peças do aplicativo vieram todas
        shell: bash
        working-directory: desktop
        run: |
          falta=0
          for a in main.js preload.js atualizacao.js publicador.js estudio.js \
                   fabrica/fabrica.py fabrica/cortes.py; do
            if [ -s "$a" ]; then echo "ok    $a"; else echo "FALTA $a"; falta=1; fi
          done
          v=$(node -p "require('./package.json').version")
          if grep -q "SISTEMA_VERSAO = '$v'" app/index.html; then
            echo "ok    o sistema $v está dentro do aplicativo"
          else
            echo "FALTA o app/index.html não é da versão $v:"
            grep -o "SISTEMA_VERSAO = '[^']*'" app/index.html | head -1
            falta=1
          fi
          exit $falta

      - name: Gerar o instalador e publicar no Releases
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      # O Python é um programa de fora: ele não consegue abrir um arquivo que
      # esteja dentro do app.asar. Se a fábrica for parar lá, o botão de gerar
      # vídeo quebra na casa do dono. Então se confere aqui, no que foi montado.
      - name: Conferir se a fábrica ficou FORA do pacote
        shell: bash
        working-directory: desktop
        run: |
          solta="dist/win-unpacked/resources/app.asar.unpacked/fabrica/fabrica.py"
          if [ -s "$solta" ]; then
            echo "ok    a fábrica está solta em app.asar.unpacked"
          else
            echo "FALTA a fábrica não saiu do app.asar — o Python não vai alcançar ela"
            ls -R dist/win-unpacked/resources 2>/dev/null | head -40
            exit 1
          fi

      - name: Guardar o instalador também como anexo do Actions
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: error
