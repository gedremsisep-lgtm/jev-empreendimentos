:root{
  /* base neutra e quente */
  --bg:#F5F4F0;--bg2:#FFFFFF;--bg3:#EDECE6;--bg4:#E1E0D8;
  --border:#E3E1DA;--border2:#CCCCC5;
  --text:#141A1D;--text2:#59636A;--text3:#8C969C;
  /* marca JeV — Petróleo e Cobre */
  --brand:#123B4E;--brand2:#1C5872;--brand-bg:#E6EEF2;--brand-lt:#B2CAD7;
  --gold:#C2703D;--gold-bg:#FAECE2;--gold-dk:#8F4E24;
  /* semânticas */
  --green:#1F7A44;--green-bg:#E7F4EC;
  --red:#A8291F;--red-bg:#FBEAE8;
  --amber:#8A5108;--amber-bg:#FDF1DF;
  --blue:#2A6CB8;--blue-bg:#E9F1FB;
  --purple:#6B3FA0;--purple-bg:#F0EAF9;
  --teal:#0E6E70;--teal-bg:#E2F3F3;
  --dark:#0A2531;--dark2:#123B4E;
  --radius:14px;--radius-sm:8px;
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --sh1:0 1px 2px rgba(12,26,33,.05),0 2px 6px rgba(12,26,33,.05);
  --sh2:0 6px 18px rgba(12,26,33,.10);
  --sh3:0 14px 40px rgba(12,26,33,.16);
  --top:58px;--ctx:46px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ================= TOPO ================= */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:6px;padding:0 14px;z-index:70}
.lgw{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none;padding-right:6px}
.lgm{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.lgm svg{width:36px;height:36px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.lgt b{font-size:15.5px;letter-spacing:.2px;display:block;line-height:1.1}
.lgt span{font-size:9.5px;color:#9FB8C5;letter-spacing:1.6px;font-weight:700;text-transform:uppercase}
.mnav{display:flex;gap:2px;margin-left:14px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.mnav::-webkit-scrollbar{height:0}
.mnav button{background:transparent;border:0;color:#BFDCD1;font-size:13.5px;font-weight:600;padding:7px 12px;flex:none;
  border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mnav button i{font-size:17px}
.mnav button:hover{background:rgba(255,255,255,.10);color:#fff}
.mnav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.tbt{width:36px;height:36px;border:0;background:rgba(255,255,255,.10);color:#fff;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex:none}
.tbt:hover{background:rgba(255,255,255,.20)}
.tperfil{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.10);border-radius:9px;
  padding:5px 10px 5px 6px;cursor:pointer;flex:none}
.tperfil .av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#0A2531;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.tperfil span{font-size:12px;font-weight:700;white-space:nowrap}

/* ================= BARRA DE CONTEXTO ================= */
.ctxbar{position:fixed;top:var(--top);left:0;right:0;height:var(--ctx);background:var(--bg2);
  border-bottom:1px solid var(--border);display:none;align-items:center;gap:4px;padding:0 14px;
  z-index:65;overflow-x:auto;box-shadow:var(--sh1)}
.ctxbar.on{display:flex}
.ctxbar::-webkit-scrollbar{height:0}
.ctxback{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#fff;
  background:var(--unc,var(--brand));padding:6px 12px;border-radius:8px;border:0;cursor:pointer;flex:none;margin-right:8px}
.ctxbar .cb{background:transparent;border:0;color:var(--text2);font-size:13px;font-weight:600;padding:7px 12px;
  border-radius:8px;cursor:pointer;white-space:nowrap;flex:none;display:flex;align-items:center;gap:5px}
.ctxbar .cb i{font-size:16px}
.ctxbar .cb:hover{background:var(--bg3);color:var(--text)}
.ctxbar .cb.on{background:var(--unbg,var(--brand-bg));color:var(--unc,var(--brand));font-weight:800}
.obsel{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:8px;padding:0 9px;height:32px;flex:none;max-width:330px}
.obsel i{font-size:16px;color:var(--text3);flex:none}
.obsel select{background:transparent;border:0;outline:none;font-size:12.5px;font-weight:700;cursor:pointer;max-width:280px}
@media(max-width:920px){.obsel{max-width:190px}.obsel select{max-width:150px}}

/* ================= MAIN ================= */
.main{padding-top:var(--top);min-height:100%}
.main.ctx{padding-top:calc(var(--top) + var(--ctx))}
.wrap{padding:20px 22px 96px;max-width:1480px;margin:0 auto}
.pg{display:none}
.pg.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================= BOTTOM NAV ================= */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg2);
  border-top:1px solid var(--border);z-index:68;padding-bottom:env(safe-area-inset-bottom)}
.bnav .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--text3);font-size:10px;font-weight:700;cursor:pointer;border:0;background:transparent}
.bnav .b i{font-size:21px}
.bnav .b.on{color:var(--brand)}

/* ================= HUB ================= */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--dark2) 60%,#0A2531 100%);
  border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero:after{content:'';position:absolute;right:-60px;top:-70px;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,145,42,.30),transparent 68%)}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.hero p{font-size:13px;color:#A9CCC0;margin-top:2px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-top:18px;position:relative;z-index:2}
.hg{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px}
.hg .l{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#9FB8C5;display:flex;align-items:center;gap:5px}
.hg .v{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.6px}
.hg .s{font-size:11px;color:#8FB8AA;margin-top:1px}
.hg.pos .v{color:#7DE0AE} .hg.neg .v{color:#FFA9A0} .hg.gold .v{color:#F0C468}

.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:15px}
.ucard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;box-shadow:var(--sh1);transition:transform .16s,box-shadow .16s;position:relative}
.ucard:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.ucard .bar{height:5px;background:var(--uc)}
.ucard .top2{display:flex;align-items:center;gap:11px;padding:14px 15px 10px}
.ucard .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:23px;flex:none;background:var(--ucb);color:var(--uc)}
.ucard h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.ucard .sub{font-size:11.5px;color:var(--text3);font-weight:600}
.ucard .body{padding:0 15px 14px}
.ucard .kv{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:12.5px}
.ucard .kv span{color:var(--text2)}
.ucard .kv b{font-variant-numeric:tabular-nums;font-weight:700}
.ucard .foot{border-top:1px solid var(--bg3);margin-top:8px;padding-top:9px;display:flex;justify-content:space-between;align-items:center}
.ucard .res{font-size:16px;font-weight:800;letter-spacing:-.4px}
.ucard .go{font-size:11.5px;font-weight:800;color:var(--uc);display:flex;align-items:center;gap:3px}

/* ================= CABEÇALHOS ================= */
.ph{display:flex;align-items:flex-start;gap:13px;margin-bottom:18px;flex-wrap:wrap}
.ph .ic{width:46px;height:46px;border-radius:13px;background:var(--brand-bg);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.ph h1{font-size:21px;font-weight:800;letter-spacing:-.4px}
.ph p{font-size:12.5px;color:var(--text2);margin-top:2px}
.ph .sp{flex:1}
.sh{font-size:11.5px;font-weight:800;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;
  margin:24px 0 10px;display:flex;align-items:center;gap:7px}
.sh i{font-size:16px;color:var(--text3)}
.sh .sp{flex:1}

/* ================= CARDS ================= */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--sh1);margin-bottom:15px;overflow:hidden}
.card>.hd{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;flex-wrap:wrap}
.card>.hd i{font-size:18px;color:var(--text2)}
.card>.hd .sp{flex:1}
.card>.bd{padding:15px}
.card>.bd:empty{display:none}
.card>.hd:has(+ .bd:empty){border-bottom:0}
.card.tw>.bd{padding:0;overflow-x:auto}
.fcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:17px;box-shadow:var(--sh1);margin-bottom:15px}

/* ================= KPI ================= */
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:12px;margin-bottom:6px}
.kc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.kc:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kc .lb{font-size:10.5px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:5px}
.kc .lb i{font-size:15px}
.kc .vl{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.7px;line-height:1.15}
.kc .sb{font-size:11px;color:var(--text3);margin-top:2px}
.kc.bl:before{background:var(--blue)} .kc.bl .vl{color:var(--blue)}
.kc.gn:before{background:var(--green)} .kc.gn .vl{color:var(--green)}
.kc.am:before{background:var(--amber)} .kc.am .vl{color:var(--amber)}
.kc.rd:before{background:var(--red)} .kc.rd .vl{color:var(--red)}
.kc.pu:before{background:var(--purple)} .kc.pu .vl{color:var(--purple)}
.kc.tl:before{background:var(--teal)} .kc.tl .vl{color:var(--teal)}
.kc.br:before{background:var(--brand)} .kc.br .vl{color:var(--brand)}
.kc.gd:before{background:var(--gold)} .kc.gd .vl{color:var(--gold-dk)}

/* ================= FORMULÁRIOS ================= */
.fr,.fr2,.fr3,.fr4{display:grid;gap:12px;margin-bottom:12px}
.fr{grid-template-columns:1fr}
.fr2{grid-template-columns:repeat(2,1fr)}
.fr3{grid-template-columns:repeat(3,1fr)}
.fr4{grid-template-columns:repeat(4,1fr)}
.fg{display:flex;flex-direction:column;gap:5px;min-width:0}
.fg label{font-size:11.5px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:4px}
.fg label .rq{color:var(--red)}
.fg input,.fg select,.fg textarea{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 11px;
  background:var(--bg2);outline:none;font-size:13.5px;width:100%;transition:border-color .12s,box-shadow .12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.fg input[readonly]{background:var(--bg3);color:var(--text2);font-weight:700}
.fg textarea{resize:vertical;min-height:70px;line-height:1.5}
.fg .hint{font-size:10.5px;color:var(--text3)}
.brow{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}
.btn{border:0;border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;transition:filter .12s,transform .06s}
.btn i{font-size:17px}
.btn:hover{filter:brightness(1.10)}
.btn:active{transform:translateY(1px)}
.btn.gh{background:var(--bg2);color:var(--text2);border:1px solid var(--border2)}
.btn.gh:hover{background:var(--bg3);filter:none}
.btn.gd{background:var(--gold);color:#0A2531}
.btn.gn{background:var(--green)} .btn.am{background:#B26A0C} .btn.rd{background:var(--red)}
.btn.pu{background:var(--purple)} .btn.bl{background:var(--blue)} .btn.dk{background:var(--dark2)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn.blk{width:100%;justify-content:center}
.ib{border:1px solid var(--border);background:var(--bg2);color:var(--text2);width:31px;height:31px;border-radius:7px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.ib:hover{background:var(--bg3);color:var(--text)}
.ib.rd:hover{background:var(--red-bg);color:var(--red);border-color:#F0C4C0}
.ib.bl:hover{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-lt)}
.ib.gn:hover{background:var(--green-bg);color:var(--green);border-color:#B6DFC4}

/* ================= ABAS ================= */
.tabs{display:flex;gap:3px;background:var(--bg3);padding:4px;border-radius:11px;margin-bottom:16px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer;
  white-space:nowrap;border:0;background:transparent;display:flex;align-items:center;gap:5px}
.tab i{font-size:16px}
.tab.on{background:var(--bg2);color:var(--brand);box-shadow:var(--sh1)}

/* ================= TABELAS ================= */
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:var(--bg3);color:var(--text2);font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.5px;padding:10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:2}
tbody td{padding:10px;border-bottom:1px solid var(--bg3);vertical-align:middle}
tbody tr:hover{background:var(--bg3)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{padding:10px;font-weight:800;background:var(--bg3);border-top:2px solid var(--border2)}
.empty{padding:38px 18px;text-align:center;color:var(--text3)}
.empty i{font-size:42px;display:block;margin-bottom:9px;opacity:.45}
.empty b{display:block;color:var(--text2);font-size:14.5px;margin-bottom:4px}

/* ================= BADGES / ALERTAS ================= */
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;white-space:nowrap}
.s-ok{background:var(--green-bg);color:var(--green)}
.s-wn{background:var(--amber-bg);color:var(--amber)}
.s-pd{background:var(--blue-bg);color:var(--blue)}
.s-bl{background:var(--red-bg);color:var(--red)}
.s-nt{background:var(--bg4);color:var(--text2)}
.s-pu{background:var(--purple-bg);color:var(--purple)}
.s-br{background:var(--brand-bg);color:var(--brand)}
.s-gd{background:var(--gold-bg);color:var(--gold-dk)}
.al{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin:12px 0;align-items:flex-start;line-height:1.55}
.al i{font-size:18px;flex:none;margin-top:1px}
.ai{background:var(--brand-bg);color:#0A2531;border:1px solid var(--brand-lt)}
.ag{background:var(--green-bg);color:#14532D;border:1px solid #B6DFC4}
.ae{background:var(--red-bg);color:#7C1D14;border:1px solid #F0C4C0}
.aw{background:var(--amber-bg);color:#6B3E05;border:1px solid #F5DCB0}
.hide{display:none!important}

/* ================= PROGRESSO ================= */
.pb{height:8px;background:var(--bg4);border-radius:5px;overflow:hidden;min-width:56px}
.pf{height:100%;background:var(--brand);border-radius:5px;transition:width .3s}
.pf.gn{background:var(--green)} .pf.am{background:#D9861A} .pf.rd{background:var(--red)}
.prow{display:flex;align-items:center;gap:8px}
.prow span{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

/* ================= BUSCA ================= */
.sbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:13px;align-items:flex-end}
.sbar .fg{flex:1;min-width:150px}
.srch{position:relative;flex:2;min-width:190px}
.srch i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none}
.srch input{padding-left:33px!important}

/* ================= MODAIS ================= */
.mk{position:fixed;inset:0;background:rgba(18,32,26,.55);backdrop-filter:blur(2px);z-index:200;display:none;
  align-items:flex-start;justify-content:center;padding:22px 12px;overflow-y:auto}
.mk.on{display:flex}
.mw{background:var(--bg2);border-radius:16px;width:100%;max-width:920px;box-shadow:var(--sh3);margin:auto}
.mw.sm{max-width:540px} .mw.lg{max-width:1200px}
.mh{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:15.5px;position:sticky;top:0;background:var(--bg2);border-radius:16px 16px 0 0;z-index:3}
.mh .sp{flex:1}
.mb{padding:18px}
.mf{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ================= GRÁFICOS ================= */
.chg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.cwrap{width:100%;overflow-x:auto}
.lgd{display:flex;flex-wrap:wrap;gap:8px 15px;margin-top:11px;font-size:11.5px}
.lgd .li{display:flex;align-items:center;gap:5px;color:var(--text2)}
.lgd .dt{width:10px;height:10px;border-radius:3px;flex:none}

/* ================= FOTOS ================= */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fslot{position:relative;aspect-ratio:4/3;border:2px dashed var(--border2);border-radius:10px;background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.fslot i{font-size:26px;color:var(--text3)}
.fslot span{font-size:10.5px;color:var(--text3);font-weight:700;margin-top:3px}
.fslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fslot .del{position:absolute;top:5px;right:5px;width:25px;height:25px;border-radius:7px;background:rgba(168,41,31,.92);
  color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;z-index:2}
.fslot .tg{position:absolute;bottom:0;left:0;right:0;background:rgba(18,32,26,.76);color:#fff;font-size:10px;font-weight:700;padding:3px 6px;z-index:1}

/* ================= GANTT ================= */
.gantt{min-width:780px;font-size:11.5px;position:relative}
.gwrap{position:relative}
.gover{position:absolute;top:0;bottom:0;left:214px;right:0;pointer-events:none;z-index:4}
.gantt .gr{display:flex;align-items:center;border-bottom:1px solid var(--bg3);min-height:32px}
.gantt .gl{width:214px;flex:none;padding:5px 10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt .gt{flex:1;position:relative;height:32px}
.gantt .gbar{position:absolute;top:8px;height:16px;border-radius:5px;overflow:hidden}
.gantt .gbar .gf{height:100%;border-radius:5px}
.gantt .gh{display:flex;border-bottom:2px solid var(--border2);background:var(--bg3);font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase}
.gantt .gh .gl{padding:8px 10px}
.gantt .gtk{flex:1;display:flex}
.gantt .gtk span{flex:1;text-align:center;padding:8px 2px;border-left:1px solid var(--border)}
.gantt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3}

/* ================= VISUALIZADORES ================= */
.vwrap{position:relative;background:#101A16;border-radius:var(--radius);overflow:hidden;height:470px}
.vwrap canvas{display:block;width:100%;height:100%;touch-action:none}
.vtool{position:absolute;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;z-index:5}
.vtool button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:7px;
  padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}
.vtool button:hover{background:rgba(255,255,255,.22)}
.vtool button.on{background:var(--gold);color:#0A2531;border-color:var(--gold)}
.vinfo{position:absolute;bottom:10px;left:10px;color:#9FB8C5;font-size:11px;background:rgba(10,26,33,.78);
  padding:6px 10px;border-radius:7px;z-index:5;line-height:1.5}
.vlgd{position:absolute;top:10px;right:10px;background:rgba(16,26,22,.82);border-radius:8px;padding:9px 11px;
  font-size:10.5px;color:#CFE0D9;z-index:5;max-height:88%;overflow-y:auto}
.vlgd .li{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.vlgd .dt{width:10px;height:10px;border-radius:2px;flex:none}
.drop{border:2px dashed var(--border2);border-radius:var(--radius);padding:28px 18px;text-align:center;background:var(--bg3);cursor:pointer}
.drop.dg{border-color:var(--brand);background:var(--brand-bg)}
.drop i{font-size:36px;color:var(--text3);display:block;margin-bottom:8px}
.drop b{display:block;font-size:13.5px;margin-bottom:3px}
.drop small{color:var(--text3);font-size:11.5px}

/* ================= DIVERSOS ================= */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;background:var(--bg3);color:var(--text2);cursor:pointer;border:1px solid transparent}
.chip.on{background:var(--brand);color:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.tt{font-size:11px;color:var(--text3)}
.nowrap{white-space:nowrap}
.divider{height:1px;background:var(--border);margin:16px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.ocard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--sh1);
  overflow:hidden;cursor:pointer;transition:box-shadow .16s,transform .16s}
.ocard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.ocard .oh{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ocard .oi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.ocard .ob{padding:12px 14px}
.ocard .row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.ocard .row span{color:var(--text2)}
.ocard .row b{font-variant-numeric:tabular-nums}
.tline{position:relative;padding-left:24px}
.tline:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tev{position:relative;padding-bottom:15px}
.tev:before{content:'';position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--brand);border:2px solid var(--bg2);box-shadow:0 0 0 2px var(--brand-lt)}
.mini{display:flex;gap:3px;align-items:flex-end;height:34px}
.mini i{flex:1;background:var(--brand-lt);border-radius:2px 2px 0 0;min-height:2px}
.mini i.on{background:var(--brand)}

/* ================= RESPONSIVO ================= */
@media(max-width:1180px){.fr4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:920px){
  .wrap{padding:14px 12px 90px}
  .mnav{display:none}
  .bnav{display:flex}
  .fr2,.fr3,.fr4{grid-template-columns:1fr}
  .kg{grid-template-columns:repeat(2,1fr);gap:10px}
  .kc .vl{font-size:18px}
  .ph h1{font-size:18px}
  .hero{padding:18px}
  .hero h1{font-size:19px}
  .hgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .hg .v{font-size:17px}
  .ugrid{grid-template-columns:1fr}
  .mw{max-width:100%}
  .fgrid{grid-template-columns:repeat(2,1fr)}
  .vwrap{height:350px}
  .tperfil span{display:none}
  .sh .tt{display:none}
  .lgt span{display:none}
}
@media(max-width:400px){.lgt b{font-size:14px}}
@media(max-width:340px){.kg,.hgrid{grid-template-columns:1fr}}

/* ================= IMPRESSÃO ================= */
@media print{
  @page{size:A4 portrait;margin:9mm 10mm}
  body{background:#fff!important;font-size:10.5px}
  .top,.ctxbar,.bnav,.wrap,.no-print,.mh,.mf{display:none!important}
  .mk{position:static!important;display:block!important;padding:0!important;background:#fff!important;overflow:visible!important;backdrop-filter:none!important}
  .mk:not(.on){display:none!important}
  .mw{box-shadow:none!important;max-width:100%!important;border-radius:0!important;margin:0!important}
  .mb{padding:0!important}
  .prn{display:block!important}
  .pg-break{page-break-before:always}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid}
  thead{display:table-header-group}
}
.prn{font-family:var(--font);color:#000;font-size:10.5px;background:#fff}
.prn .phd{display:flex;align-items:center;gap:13px;border-bottom:2.5px solid #123B4E;padding-bottom:9px;margin-bottom:12px}
.prn .phd .lg{width:54px;height:54px;flex:none;display:flex}
.prn .phd .lg svg{width:54px;height:54px;border-radius:11px}
.prn .phd .tx b{font-size:14.5px;display:block;letter-spacing:.3px}
.prn .phd .tx span{font-size:9.5px;color:#333;display:block}
.prn .ptt{text-align:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin:10px 0 3px}
.prn .pst{text-align:center;font-size:10px;color:#444;margin-bottom:12px}
.prn table{font-size:9.5px;border:1px solid #999}
.prn thead th{background:#E7EBE9!important;color:#000;border:1px solid #999;padding:5px 6px;font-size:8.5px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;position:static}
.prn tbody td{border:1px solid #BBB;padding:4px 6px}
.prn tfoot td{background:#E7EBE9!important;border:1px solid #999;padding:5px 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.prn .pkg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.prn .pkc{border:1px solid #999;border-radius:5px;padding:6px 8px}
.prn .pkc .l{font-size:8px;font-weight:800;text-transform:uppercase;color:#444}
.prn .pkc .v{font-size:13px;font-weight:800;margin-top:2px}
.prn .psec{font-size:10px;font-weight:800;text-transform:uppercase;background:#123B4E;color:#fff;padding:4px 8px;
  margin:13px 0 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.prn .psig{margin-top:36px;display:flex;justify-content:space-around;text-align:center;gap:22px}
.prn .psig div{flex:1;max-width:250px}
.prn .psig .ln{border-top:1px solid #000;padding-top:4px;font-size:9.5px;font-weight:700}
.prn .psig .rl{font-size:8.5px;color:#444}
.prn .pft{margin-top:17px;border-top:1px solid #999;padding-top:5px;font-size:8px;color:#555;display:flex;justify-content:space-between}
.prn .pinf{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 15px;font-size:9.5px;margin-bottom:11px;
  border:1px solid #CCC;padding:8px 10px;border-radius:5px}
.prn .pinf b{color:#000} .prn .pinf span{color:#555}
.prn .pfg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
